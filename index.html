<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Modelo de Teachable Machine</title>
    <!-- Librerías de TensorFlow.js y Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Clasificador de Imágenes - Teachable Machine</h2>
    <button type="button" onclick="init()">Start (Iniciar Cámara)</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script type="text/javascript">
        // URL de tu modelo
        const URL = "https://teachablemachine.withgoogle.com/models/8UbsgjAVd/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 1. Cargar modelo y metadatos
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 2. Configurar la webcam
            const flip = true; // Efecto espejo
            webcam = new tmImage.Webcam(250, 250, flip);
            await webcam.setup(); // Solicitar permiso al usuario
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 3. Montar el video en la pantalla
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.innerHTML = ""; // Limpiar por si se presiona más de una vez
            webcamContainer.appendChild(webcam.canvas);

            // 4. Preparar las etiquetas de predicción
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // Muestra el nombre de la clase y el porcentaje (ej. 95%)
                const percentage = (prediction[i].probability * 100).toFixed(0);
                labelContainer.childNodes[i].innerHTML = `${prediction[i].className}: ${percentage}%`;
            }
        }
    </script>
</body>
</html>
